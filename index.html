<script>
    let lancamentos = JSON.parse(localStorage.getItem('mobitex_db')) || [];
    let contas = JSON.parse(localStorage.getItem('mobitex_contas')) || ["Banco", "Carteira"];
    let categorias = JSON.parse(localStorage.getItem('mobitex_cats')) || ["Alimentação", "Lazer", "Saúde", "Fixos"];
    let itemSelecionado = null;
    let tipoDashAtual = 'saida';
    let modoFiltroLista = 'todos'; 
    let tipoFiltroLista = '';
    let categoriaFiltroLista = '';
    
    let dataNavegacaoDash = ""; 
    let dataNavegacaoLista = "";

    window.onload = () => { resetarFiltroMes(); };

    function resetarFiltroMes() {
        if(!document.getElementById('filtroMes').value) {
            const hoje = new Date();
            document.getElementById('filtroMes').value = hoje.toISOString().substring(0, 7);
        }
        atualizarSaldos();
    }

    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    
    function fecharModal(id) { 
        document.getElementById(id).style.display = 'none'; 
        atualizarSaldos(); 
    }

    function navegarPeriodo(direcao, contexto) {
        let dataReferencia = (contexto === 'dash') ? dataNavegacaoDash : dataNavegacaoLista;
        let [ano, mes] = dataReferencia.split('-').map(Number);
        const novaData = new Date(ano, (mes - 1) + direcao, 1);
        const novaDataString = novaData.toISOString().substring(0, 7);
        if(contexto === 'dash') { dataNavegacaoDash = novaDataString; renderizarGraficoDash(); }
        else { dataNavegacaoLista = novaDataString; renderizarListaFiltrada(); }
    }

    function atualizarSaldos() {
        renderizarContas(); 
        renderizarCategorias();
        const mesF = document.getElementById('filtroMes').value;
        const contaF = document.getElementById('filtroConta').value;
        let r = 0, p = 0, peE = 0, peS = 0, tME = 0, tMS = 0;
        let saldosPorConta = {}; 
        contas.forEach(c => saldosPorConta[c] = 0);
        
        lancamentos.forEach(l => {
            const v = l.tipo === 'entrada' ? l.valor : -l.valor;
            const mesL = l.data.substring(0,7);
            if(l.status === 'pago') { 
                if(saldosPorConta.hasOwnProperty(l.conta)) saldosPorConta[l.conta] += v; 
                if(contaF === 'Todas' || l.conta === contaF) r += v; 
            }
            if(mesL <= mesF && (contaF === 'Todas' || l.conta === contaF)) p += v;
            if(!l.desc.includes("Transf.") && mesL === mesF && (contaF === 'Todas' || l.conta === contaF)) {
                if(l.tipo === 'entrada') { tME += l.valor; if(l.status === 'pendente') peE += l.valor; }
                else { tMS += l.valor; if(l.status === 'pendente') peS += l.valor; }
            }
        });

        const dashContas = document.getElementById('dashContasLista'); 
        dashContas.innerHTML = '';
        for(let c in saldosPorConta) dashContas.innerHTML += `<div class="acc-item"><small>${c}</small><strong>R$ ${saldosPorConta[c].toFixed(2)}</strong></div>`;
        
        document.getElementById('saldoReal').innerText = `R$ ${r.toFixed(2)}`;
        document.getElementById('saldoPrevisto').innerText = `R$ ${p.toFixed(2)}`;
        document.getElementById('totalPendEntrada').innerText = `R$ ${peE.toFixed(2)}`;
        document.getElementById('totalPendSaida').innerText = `R$ ${peS.toFixed(2)}`;
        document.getElementById('totalMesEntrada').innerText = `R$ ${tME.toFixed(2)}`;
        document.getElementById('totalMesSaida').innerText = `R$ ${tMS.toFixed(2)}`;
    }

    function abrirAnaliseGrafica() { 
        dataNavegacaoDash = document.getElementById('filtroMes').value; 
        renderizarGraficoDash(); 
        abrirModal('modalDash'); 
    }

    function mudarTipoDash(t) {
        tipoDashAtual = t;
        document.getElementById('btnDashSaida').classList.toggle('active', t === 'saida');
        document.getElementById('btnDashEntrada').classList.toggle('active', t === 'entrada');
        renderizarGraficoDash();
    }

    function renderizarGraficoDash() {
        const mesF = dataNavegacaoDash; 
        document.getElementById('labelMesDash').innerText = mesF.split('-').reverse().join('/');
        const dados = lancamentos.filter(l => l.data.substring(0,7) === mesF && l.tipo === tipoDashAtual && !l.desc.includes("Transf."));
        const total = dados.reduce((acc, curr) => acc + curr.valor, 0);
        const legendaDiv = document.getElementById('legendaCategorias');
        const donutLabel = document.getElementById('donutPercent');
        legendaDiv.innerHTML = '';
        document.getElementById('totalGastoDash').innerText = `Total: R$ ${total.toFixed(2)}`;
        document.getElementById('totalGastoDash').style.color = tipoDashAtual === 'saida' ? 'var(--danger)' : 'var(--primary)';

        if(total === 0) {
            document.getElementById('graficoDonut').style.background = '#eee';
            donutLabel.innerText = "Sem dados";
        } else {
            let resumo = {}; dados.forEach(d => resumo[d.categoria] = (resumo[d.categoria] || 0) + d.valor);
            let lastPerc = 0, grad = 'conic-gradient(';
            const cores = tipoDashAtual === 'saida' ? ["#e74c3c", "#e67e22", "#f1c40f", "#34495e", "#9b59b6"] : ["#2ecc71", "#1abc9c", "#3498db", "#27ae60", "#2980b9"];
            donutLabel.innerHTML = `<small>CATEGORIAS</small><br>${Object.keys(resumo).length}`;
            Object.keys(resumo).forEach((cat, i) => {
                let p = (resumo[cat] / total) * 100, cor = cores[i % cores.length];
                grad += `${cor} ${lastPerc}% ${lastPerc + p}%,`;
                legendaDiv.innerHTML += `<div class="legend-item" style="border-left-color:${cor}" onclick="abrirFiltradoPorCategoria('${cat}')"><span><span class="legend-color" style="background:${cor}"></span><strong>${cat}</strong></span><span>R$ ${resumo[cat].toFixed(2)} (${p.toFixed(1)}%)</span></div>`;
                lastPerc += p;
            });
            document.getElementById('graficoDonut').style.background = grad.slice(0, -1) + ')';
        }
    }

    function abrirFiltrado(modo, tipoF = '') {
        modoFiltroLista = modo; 
        tipoFiltroLista = tipoF;
        dataNavegacaoLista = document.getElementById('filtroMes').value; 
        renderizarListaFiltrada();
        abrirModal('modalListagem');
    }

    function abrirFiltradoPorCategoria(cat) {
        modoFiltroLista = 'categoria';
        categoriaFiltroLista = cat;
        tipoFiltroLista = tipoDashAtual;
        dataNavegacaoLista = dataNavegacaoDash; 
        renderizarListaFiltrada();
        abrirModal('modalListagem');
    }

    function renderizarListaFiltrada() {
        const listaDiv = document.getElementById('listaItems');
        const mesF = dataNavegacaoLista; 
        const [ano, mes] = mesF.split('-');
        document.getElementById('labelMesModal').innerText = `${mes}/${ano}`;
        listaDiv.innerHTML = '';

        let filtrados = lancamentos.filter(l => l.data.substring(0,7) === mesF);
        
        if(modoFiltroLista === 'categoria') {
            filtrados = filtrados.filter(l => l.categoria === categoriaFiltroLista && l.tipo === tipoFiltroLista);
        } else if(modoFiltroLista === 'pendentes') {
            filtrados = filtrados.filter(l => l.status === 'pendente' && l.tipo === tipoFiltroLista);
        } else if(modoFiltroLista === 'mes_total') {
            filtrados = filtrados.filter(l => l.tipo === tipoFiltroLista);
        }

        if(modoFiltroLista !== 'todos' && modoFiltroLista !== 'categoria') {
            filtrados = filtrados.filter(l => !l.desc.includes("Transf."));
        }

        document.getElementById('tituloModal').innerText = modoFiltroLista === 'todos' ? "Extrato" : (tipoFiltroLista === 'entrada' ? "Receitas" : "Despesas");

        if(filtrados.length === 0) {
            listaDiv.innerHTML = '<p style="text-align:center; padding:20px; color:#999;">Nenhum lançamento encontrado.</p>';
        }

        filtrados.sort((x,y) => new Date(x.data) - new Date(y.data)).forEach(l => {
            listaDiv.innerHTML += `<div class="item-row" onclick="verDetalhes('${l.id}')"><div><b>${l.desc}</b><br><small>${l.data.split('-').reverse().join('/')} • ${l.conta} • ${l.categoria}</small></div><b style="color:${l.tipo==='entrada'?'var(--primary)':'var(--danger)'}">R$ ${l.valor.toFixed(2)}</b></div>`;
        });
    }

    function verDetalhes(id) { 
        // Convertemos id para string na busca para evitar erro de tipo (número vs string)
        itemSelecionado = lancamentos.find(l => String(l.id) === String(id)); 
        if(!itemSelecionado) return;

        document.getElementById('viewDesc').innerText = itemSelecionado.desc; 
        document.getElementById('viewCorpo').innerHTML = `<p><b>Valor:</b> R$ ${itemSelecionado.valor.toFixed(2)}<br><b>Data:</b> ${itemSelecionado.data.split('-').reverse().join('/')}<br><b>Conta:</b> ${itemSelecionado.conta}<br><b>Categoria:</b> ${itemSelecionado.categoria}<br><b>Status:</b> ${itemSelecionado.status.toUpperCase()}</p>`; 
        
        document.getElementById('btnExcluirFuturos').style.display = itemSelecionado.grupoId ? 'block' : 'none';
        document.getElementById('btnExcluirGeral').style.display = itemSelecionado.grupoId ? 'block' : 'none';
        document.getElementById('btnBaixa').style.display = itemSelecionado.status === 'pago' ? 'none' : 'block';
        
        // Reseta menu de exclusão
        cancelarExclusao();
        abrirModal('modalAcoes'); 
    }

    function darBaixaAtivo() { 
        itemSelecionado.status = 'pago'; 
        localStorage.setItem('mobitex_db', JSON.stringify(lancamentos)); 
        atualizarSaldos(); 
        fecharModal('modalAcoes'); 
    }

    function confirmarExclusao(m) { 
        if(m === 'unico') {
            lancamentos = lancamentos.filter(l => String(l.id) !== String(itemSelecionado.id));
        } else if(m === 'futuros') {
            lancamentos = lancamentos.filter(l => l.grupoId !== itemSelecionado.grupoId || l.data < itemSelecionado.data);
        } else {
            lancamentos = lancamentos.filter(l => l.grupoId !== itemSelecionado.grupoId);
        }
        localStorage.setItem('mobitex_db', JSON.stringify(lancamentos)); 
        
        if(document.getElementById('modalListagem').style.display === 'flex') renderizarListaFiltrada();
        fecharModal('modalAcoes'); 
    }
    
    function renderizarContas() {
        const s = document.getElementById('contaSelect'), f = document.getElementById('filtroConta'), le = document.getElementById('listaContasEdit'), aj = document.getElementById('ajusteContaSelect'), tO = document.getElementById('transfOrigem'), tD = document.getElementById('transfDestino');
        const valF = f.value; 
        f.innerHTML = '<option value="Todas">Todas Contas</option>'; 
        s.innerHTML = ''; le.innerHTML = ''; aj.innerHTML = ''; tO.innerHTML = ''; tD.innerHTML = '';
        contas.forEach(c => {
            const opt = `<option value="${c}">${c}</option>`;
            f.innerHTML += opt; s.innerHTML += opt; aj.innerHTML += opt; tO.innerHTML += opt; tD.innerHTML += opt;
            le.innerHTML += `<div style="display:flex; justify-content:space-between; padding:8px; background:#f9f9f9; margin-bottom:5px; border-radius:8px;"><b>${c}</b><button onclick="removerConta('${c}')" style="color:red; border:none; background:none; cursor:pointer">Remover</button></div>`;
        });
        f.value = valF || 'Todas';
    }

    function renderizarCategorias() {
        const s = document.getElementById('categoriaSelect'), le = document.getElementById('listaCategoriasEdit');
        s.innerHTML = ''; le.innerHTML = '';
        categorias.forEach(c => {
            s.innerHTML += `<option value="${c}">${c}</option>`;
            le.innerHTML += `<div style="display:flex; justify-content:space-between; padding:8px; background:#f9f9f9; margin-bottom:5px; border-radius:8px;"><b>${c}</b><button onclick="removerCategoria('${c}')" style="color:red; border:none; background:none; cursor:pointer">Remover</button></div>`;
        });
    }

    function adicionarConta() { const n = document.getElementById('nomeNovaConta').value; if(n) { contas.push(n); localStorage.setItem('mobitex_contas', JSON.stringify(contas)); renderizarContas(); document.getElementById('nomeNovaConta').value = ''; } }
    function removerConta(n) { contas = contas.filter(c => c !== n); localStorage.setItem('mobitex_contas', JSON.stringify(contas)); renderizarContas(); }
    function adicionarCategoria() { const n = document.getElementById('nomeNovaCategoria').value; if(n) { categorias.push(n); localStorage.setItem('mobitex_cats', JSON.stringify(categorias)); renderizarCategorias(); document.getElementById('nomeNovaCategoria').value = ''; } }
    function removerCategoria(n) { categorias = categorias.filter(c => c !== n); localStorage.setItem('mobitex_cats', JSON.stringify(categorias)); renderizarCategorias(); }
    
    function confirmarTransferencia() { 
        const de = document.getElementById('transfOrigem').value, para = document.getElementById('transfDestino').value, v = parseFloat(document.getElementById('transfValor').value), da = document.getElementById('transfData').value; 
        if(de === para || isNaN(v) || !da) return; 
        const tid = String(Date.now()); 
        lancamentos.push({id:tid, desc:`Transf. para ${para}`, valor:v, data:da, conta:de, status:'pago', tipo:'saida', categoria:'Transferência'}, {id:tid+'_1', desc:`Transf. de ${de}`, valor:v, data:da, conta:para, status:'pago', tipo:'entrada', categoria:'Transferência'}); 
        localStorage.setItem('mobitex_db', JSON.stringify(lancamentos)); atualizarSaldos(); fecharModal('modalTransferencia'); 
    }

    function confirmarAjuste() { 
        const cA = document.getElementById('ajusteContaSelect').value, nv = parseFloat(document.getElementById('novoSaldoInformado').value); 
        let sS = 0; 
        lancamentos.forEach(l => { if(l.conta === cA && l.status === 'pago') sS += (l.tipo === 'entrada' ? l.valor : -l.valor); }); 
        const diff = nv - sS; 
        if(diff !== 0) { 
            lancamentos.push({id: String(Date.now()), desc: "Ajuste Saldo", valor: Math.abs(diff), data: new Date().toISOString().split('T')[0], conta: cA, status: 'pago', tipo: diff > 0 ? 'entrada' : 'saida', categoria: 'Ajuste'}); 
            localStorage.setItem('mobitex_db', JSON.stringify(lancamentos)); 
        } 
        atualizarSaldos(); 
        fecharModal('modalAjuste'); 
    }
    
    function prepararEdicao() { 
        fecharModal('modalAcoes'); 
        document.getElementById('editId').value = itemSelecionado.id; 
        document.getElementById('desc').value = itemSelecionado.desc.split(' (')[0]; 
        document.getElementById('valor').value = itemSelecionado.valor; 
        document.getElementById('data').value = itemSelecionado.data; 
        document.getElementById('contaSelect').value = itemSelecionado.conta; 
        document.getElementById('categoriaSelect').value = itemSelecionado.categoria; 
        document.getElementById('status').value = itemSelecionado.status; 
        document.getElementById('tipo').value = itemSelecionado.tipo; 
        abrirModal('modalLancamento'); 
    }

    function prepararSalvar() { 
        if(document.getElementById('editId').value && itemSelecionado?.grupoId) { 
            document.getElementById('menuAlcanceEdicao').style.display = 'block'; 
        } else { 
            executarSalvar('unico'); 
        } 
    }

    function executarSalvar(alcance) {
        const id = document.getElementById('editId').value, desc = document.getElementById('desc').value, vt = parseFloat(document.getElementById('valor').value), dat = document.getElementById('data').value, tr = document.getElementById('tipoRecorrencia').value, t = document.getElementById('tipo').value, c = document.getElementById('contaSelect').value, cat = document.getElementById('categoriaSelect').value, s = document.getElementById('status').value;
        if(!desc || isNaN(vt) || !dat) return;

        if(!id) {
            const gid = (tr !== 'unico') ? Date.now() : null;
            let q = tr === 'parcelado' ? (parseInt(document.getElementById('qtdP').value) || 1) : (tr === 'recorrente' ? 12 : 1);
            const [y, m, d] = dat.split('-').map(Number);
            for(let i=0; i<q; i++) {
                let da = new Date(y, (m-1)+i, d); if(da.getDate() !== d) da = new Date(y, (m-1)+i+1, 0);
                lancamentos.push({id: String(Date.now() + Math.random()), grupoId:gid, desc:(tr==='parcelado')?`${desc} (${i+1}/${q})`:desc, valor:(tr==='parcelado')?vt/q:vt, data:da.toISOString().split('T')[0], conta:c, categoria:cat, status:i===0?s:'pendente', tipo:t});
            }
        } else {
            let editados = lancamentos.filter(l => (alcance === 'futuros') ? (l.grupoId === itemSelecionado.grupoId && l.data >= itemSelecionado.data) : (alcance === 'todos' ? l.grupoId === itemSelecionado.grupoId : String(l.id) === String(id)));
            editados.forEach(l => { 
                l.desc = desc; l.valor = (tr === 'parcelado' && alcance !== 'unico') ? vt/parseInt(document.getElementById('qtdP').value) : vt; 
                l.conta = c; l.categoria = cat; l.tipo = t; l.data = dat; l.status = s;
            });
        }
        localStorage.setItem('mobitex_db', JSON.stringify(lancamentos)); 
        if(document.getElementById('modalListagem').style.display === 'flex') renderizarListaFiltrada();
        if(document.getElementById('modalDash').style.display === 'flex') renderizarGraficoDash();
        fecharModal('modalLancamento');
    }

    function abrirParaNovo() { 
        document.getElementById('editId').value = ''; 
        document.getElementById('desc').value = ''; 
        document.getElementById('data').valueAsDate = new Date(); 
        document.getElementById('menuAlcanceEdicao').style.display='none'; 
        abrirModal('modalLancamento'); 
    }
    
    function abrirAjuste() { abrirModal('modalAjuste'); }
    function abrirGerenciarContas() { abrirModal('modalContas'); }
    function abrirGerenciarCategorias() { abrirModal('modalCategorias'); }
    function abrirTransferencia() { abrirModal('modalTransferencia'); }
    function toggleParcelas(v) { document.getElementById('qtdP').style.display = v === 'parcelado' ? 'block' : 'none'; }
    function mostrarMenuExcluir() { document.getElementById('acoesPrincipais').style.display = 'none'; document.getElementById('menuExcluir').style.display = 'flex'; }
    function cancelarExclusao() { document.getElementById('acoesPrincipais').style.display = 'grid'; document.getElementById('menuExcluir').style.display = 'none'; }
</script>
